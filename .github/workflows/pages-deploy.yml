name: Deploy Docsify site

# Publishes main to the root of the gh-pages branch.
# PR previews live under pr-preview/ on the same branch (see pages-pr-preview.yml),
# so that folder is preserved on every deploy.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://percona.github.io/percona-messaging/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build static publish directory
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            ./ _site/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false
