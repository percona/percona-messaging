# Spelling (typos), markdown structure (markdownlint-cli2), and URL health (lychee).
# Uses published marketplace actions; see reference/launch-and-automation-backlog.md.

name: Prose and links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "_typos.toml"
      - ".lychee.toml"
      - ".markdownlint.yaml"
      - ".markdownlintignore"

permissions:
  contents: read

concurrency:
  group: prose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: Spelling (typos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check spelling
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1
        with:
          config: _typos.toml
          files: "**/*.md"

  markdownlint:
    name: Markdown structure (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md

  lychee:
    name: Links (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # lychee-action@v1.9.0 defaults to lychee 0.14.0, which ignored `accept` from
      # .lychee.toml (429 still failed). Pin >=0.14.1 so accept=429 is honored; see
      # https://github.com/lycheeverse/lychee/issues/1340
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --verbose --no-progress '**/*.md'
          fail: true
          lycheeVersion: "v0.14.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
