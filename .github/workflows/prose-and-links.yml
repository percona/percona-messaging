# Spelling (typos), markdown structure (markdownlint-cli2), and URL health (lychee).
# Uses published marketplace actions; see reference/launch-and-automation-backlog.md.

name: Prose and links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "_typos.toml"
      - ".lychee.toml"
      - ".markdownlint.yaml"
      - ".markdownlintignore"

permissions:
  contents: read

concurrency:
  group: prose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: Spelling (typos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check spelling
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1
        with:
          config: _typos.toml
          files: "**/*.md"

  markdownlint:
    name: Markdown structure (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: |
            **/*.md

  lychee:
    name: Links (lychee)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # lychee-action@v1.9.0 defaults to lychee 0.14.0, which ignored `accept` from
      # .lychee.toml (429 still failed). Pin >=0.14.1 so accept=429 is honored; see
      # https://github.com/lycheeverse/lychee/issues/1340
      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config .lychee.toml --verbose --no-progress '**/*.md'
          fail: true
          lycheeVersion: "v0.14.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
